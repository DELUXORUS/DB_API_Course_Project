<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>
    <main>
        <h2>Регистрация пользователя</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="post">
            <label for="passport_number">Номер паспорта</label>
            <input type="text" name="passport_number" id="passport_number" required>

            <label for="passport_issued_by">Кем выдан</label>
            <input type="text" name="passport_issued_by" id="passport_issued_by" required>

            <label for="passport_issue_date">Дата выдачи паспорта</label>
            <input type="date" name="passport_issue_date" id="passport_issue_date" required>

            <label for="real_name">Настоящее ФИО</label>
            <input type="text" name="real_name" id="real_name" required>

            <label for="birth_date">Дата рождения</label>
            <input type="date" name="birth_date" id="birth_date" required>

            <label for="registration_address">Адрес регистрации</label>
            <input type="text" name="registration_address" id="registration_address" required>

            <label for="login">Имя пользователя</label>
            <input type="text" name="login" id="login" required>

            <label for="password">Пароль</label>
            <input type="password" name="password" id="password" required>

            <button type="submit">Зарегистрироваться</button>
        </form>
    </main>
</body>
</html>
